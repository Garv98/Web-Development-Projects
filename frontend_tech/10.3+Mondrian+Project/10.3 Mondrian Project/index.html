<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    body{
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }
    .container{
      display: grid;
      background-color: black;
      width: 748px;
      height: 748px;
      gap: 9px;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 20px;
    }
    .white{
      background-color: #F0F1EC;
    }
    .first{
      grid-area: 1 / 2 / 2 / -1;
    }
    .second{
      grid-area: 2 / 1 / 4 / 2;
    }
    .third{
      grid-area: 2 / 2 / 4 / 4;
    }
    .fourth{
      grid-area: 4 / 1 / -1 / 2;
    }
    .fifth{
      grid-area: 3 / 4 / -1 / -1;
    }
    .red{
      background-color: #E72F24;
      width: 320px;
      height: 414px;
    }
    .blue{
      background-color: #004592;
      border-bottom: 10px solid black;
      grid-area: 2 / 4 / 3 / -1;
    }
    .black{
      background-color: #232629;
      grid-area: 4 / 3 / -1 / 4;
    }
    .yellow{
      background-color: #F9D01E;
      grid-area: 4 / 2 / -1 / 3;
    }

  </style>
</head>

<body>
  <div class="container">
    <div class="item red"></div>
    <div class="item white first"></div>
    <div class="item white second"></div>
    <div class="item white third"></div>
    <div class="item blue"></div>
    <div class="item white fourth"></div>
    <div class="item yellow"></div>
    <div class="item black"></div>
    <div class="item white fifth"></div>
  </div>
</body>

</html>
