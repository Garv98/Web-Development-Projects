<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    /* Write your code here */
    .blue-box{
      background-color: blue;
      position: relative;    /* relative is with respect to its initial position */
      width: 500px;
      height: 300px;
      left: 200px;
      top: 200px;
    }
    .red-circle{
      background-color: red;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      position: absolute;    /* absolute is w.r.t to nearest ancestor or if no ancestor, then to left-top corner of page */
      top: 150px;
      left: 250px;
    }
  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>
